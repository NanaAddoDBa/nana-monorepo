services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aventra
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: aventra
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aventra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aventra-postgres:/var/lib/postgresql/data
volumes:
  aventra-postgres:
