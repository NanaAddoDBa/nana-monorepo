name: Aventra / Publish rent-car-react

on:
  push:
    branches: ["main"]
    paths:
      - "apps/rent-car/**"
      - ".github/workflows/rent-car-pages.yml"
  workflow_dispatch:

# GitHub's default token only needs read access to the source monorepo.
# The scoped secret publishes to a separate, public repository.
permissions:
  contents: read

concurrency:
  group: aventra-rent-car-react
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish generated website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/rent-car
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build for the target project URL
        working-directory: apps/rent-car
        env:
          VITE_BASE_PATH: /rent-car-react/
          VITE_BOOKING_EMAIL: ${{ vars.AVENTRA_BOOKING_EMAIL }}
          VITE_CONTACT_PHONE: ${{ vars.AVENTRA_CONTACT_PHONE }}
          VITE_PRODUCTION_READY: ${{ vars.AVENTRA_PRODUCTION_READY || 'false' }}
        run: npm run check
      - name: Check whether cross-repository publishing is configured
        id: readiness
        env:
          DEPLOY_TOKEN: ${{ secrets.RENT_CAR_PAGES_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publishing not configured::Create the public NanaAddoDBa/rent-car-react repository and set the RENT_CAR_PAGES_TOKEN secret in nana-monorepo."
            echo "Built and tested successfully. Publishing was skipped because RENT_CAR_PAGES_TOKEN is missing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify destination repository exists and is accessible
        if: steps.readiness.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.RENT_CAR_PAGES_TOKEN }}
        run: |
          if ! curl --fail --silent --show-error \
              --header "Authorization: Bearer $DEPLOY_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/NanaAddoDBa/rent-car-react" > /dev/null; then
            echo "::error::Create NanaAddoDBa/rent-car-react and grant RENT_CAR_PAGES_TOKEN Contents: read/write access to it."
            exit 1
          fi
      - name: Publish dist to gh-pages in rent-car-react
        if: steps.readiness.outputs.enabled == 'true'
        shell: bash
        working-directory: apps/rent-car/dist
        env:
          DEPLOY_TOKEN: ${{ secrets.RENT_CAR_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          touch .nojekyll
          git init -b gh-pages
          git config user.name "NanaAddoDBA"
          git config user.email "nanaaddoldoe@gmail.com"
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT
          git remote add publish "https://x-access-token:${DEPLOY_TOKEN}@github.com/NanaAddoDBa/rent-car-react.git"
          git fetch --depth=1 publish gh-pages
          git reset --soft FETCH_HEAD
          git add -A
          if git diff --cached --quiet; then
            echo "The published site already matches this build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "deploy: Aventra build from nana-monorepo ${GITHUB_SHA}"
          git push publish HEAD:gh-pages
          echo "Published generated files to NanaAddoDBa/rent-car-react branch gh-pages." >> "$GITHUB_STEP_SUMMARY"
          echo "Target site after destination Pages is enabled: https://nanaaddodba.github.io/rent-car-react/" >> "$GITHUB_STEP_SUMMARY"
