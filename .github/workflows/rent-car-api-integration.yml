name: Aventra / API integration

on:
  pull_request:
    branches: ["master"]
    paths:
      - "apps/rent-car-api/**"
      - "packages/rental-contracts/**"
      - ".github/workflows/rent-car-api-integration.yml"
  push:
    branches: ["master"]
    paths:
      - "apps/rent-car-api/**"
      - "packages/rental-contracts/**"
      - ".github/workflows/rent-car-api-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aventra
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aventra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aventra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/rent-car-api
    env:
      TEST_DATABASE_URL: postgresql://aventra:testpassword@localhost:5432/aventra_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run ci
