name: Aventra / CI

on:
  push:
    branches: ["main", "master", "feat/**"]
    paths:
      - "apps/rent-car/**"
      - ".github/workflows/rent-car-ci.yml"
      - ".github/workflows/rent-car-pages.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "apps/rent-car/**"
      - ".github/workflows/rent-car-ci.yml"
      - ".github/workflows/rent-car-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rent-car
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, unit tests and production build
        run: npm run check
